<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pilurica — preuzimanje stare kopije</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #eef3ec;
        color: #14301c;
        font-family: system-ui, sans-serif;
      }
      .card {
        width: min(22rem, 100%);
        background: #fff;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 8px 24px rgba(20, 48, 28, 0.08);
      }
      h1 { margin: 0 0 10px; font-size: 1.25rem; }
      p { margin: 0 0 12px; line-height: 1.45; }
      button, a {
        display: block; width: 100%; text-align: center; text-decoration: none;
        background: #167a3a; color: #fff; font-weight: 700; padding: 14px 16px;
        border-radius: 12px; border: 0; cursor: pointer; font: inherit;
        margin-top: 8px;
      }
      button[hidden], a[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Stara Pilurica</h1>
      <p id="msg">Čitam osobe, lijekove, slike kutija, zalihe i satnice…</p>
      <button type="button" id="go" hidden>Pošalji u novu Piluricu</button>
      <button type="button" id="dl" hidden>Spremi JSON sa slikama</button>
    </div>
    <script>
      const DB = "lijekovi-podsjetnik";
      const msg = document.getElementById("msg");
      const go = document.getElementById("go");
      const dl = document.getElementById("dl");
      let payload = null;

      function getAll(db, store) {
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(store, "readonly");
            const req = tx.objectStore(store).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          } catch {
            resolve([]);
          }
        });
      }

      function toBytes(value) {
        if (!value) return null;
        if (value instanceof ArrayBuffer) return new Uint8Array(value);
        if (value instanceof Uint8Array) return value;
        if (value.buffer instanceof ArrayBuffer) return new Uint8Array(value.buffer);
        return null;
      }

      function bytesToDataUrl(bytes, mime) {
        const chunk = 0x8000;
        let binary = "";
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return "data:" + (mime || "image/jpeg") + ";base64," + btoa(binary);
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(String(r.result || ""));
          r.onerror = () => reject(r.error);
          r.readAsDataURL(blob);
        });
      }

      async function rawToDataUrl(raw, mime) {
        if (typeof Blob !== "undefined" && raw instanceof Blob) {
          mime = raw.type || mime;
          try {
            if (typeof createImageBitmap === "function") {
              const bmp = await createImageBitmap(raw);
              const max = 720;
              const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
              const c = document.createElement("canvas");
              c.width = Math.max(1, Math.round(bmp.width * scale));
              c.height = Math.max(1, Math.round(bmp.height * scale));
              const ctx = c.getContext("2d");
              ctx.drawImage(bmp, 0, 0, c.width, c.height);
              bmp.close();
              return c.toDataURL("image/jpeg", 0.72);
            }
          } catch (_) {}
          return blobToDataUrl(raw);
        }
        const bytes = toBytes(raw);
        if (bytes && bytes.length) return bytesToDataUrl(bytes, mime);
        if (typeof raw === "string" && raw.startsWith("data:image/")) return raw;
        if (typeof raw === "string" && raw.length > 24) {
          return "data:" + (mime || "image/jpeg") + ";base64," + raw.replace(/^data:[^,]*,/, "");
        }
        return "";
      }

      async function dump() {
        const db = await new Promise((resolve, reject) => {
          const req = indexedDB.open(DB);
          req.onupgradeneeded = () => req.transaction.abort();
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        const names = Array.from(db.objectStoreNames);
        const patients = names.includes("patients") ? await getAll(db, "patients") : [];
        const medicines = names.includes("medicines") ? await getAll(db, "medicines") : [];
        const doseLogs = names.includes("doseLogs") ? await getAll(db, "doseLogs") : [];
        const rawPhotos = names.includes("photos") ? await getAll(db, "photos") : [];
        db.close();
        const photos = [];
        for (const p of rawPhotos) {
          const mime = (p && (p.mimeType || (p.blob && p.blob.type))) || "image/jpeg";
          const dataUrl = await rawToDataUrl(p && (p.blob || p.data || p.base64), mime);
          const base64 = dataUrl.includes(",") ? dataUrl.split(",")[1] : dataUrl;
          if (!base64) continue;
          photos.push({
            id: p.id,
            medicineId: p.medicineId,
            patientId: p.patientId || "",
            kind: p.kind || "box",
            slot: p.slot ?? 0,
            mimeType: "image/jpeg",
            base64,
          });
        }
        return {
          version: 1,
          app: "pilurica",
          exportedAt: new Date().toISOString(),
          patients,
          medicines,
          doseLogs,
          photos,
        };
      }

      function download() {
        if (!payload) return;
        const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "pilurica-stara.json";
        a.click();
        msg.textContent = "JSON sa slikama je spremljen. U novoj Pilurici odaberi tu datoteku.";
      }

      function post(obj) {
        if (!window.opener) return false;
        window.opener.postMessage(obj, "*");
        return true;
      }

      function send() {
        if (!payload) return;
        const photos = payload.photos || [];
        const slim = Object.assign({}, payload, { photos: [] });
        let opened = false;
        try {
          opened = post({ type: "pilurica-stara-kopija", payload: slim });
        } catch (_) {
          opened = false;
        }
        if (opened) {
          for (let i = 0; i < photos.length; i += 1) {
            try {
              post({ type: "pilurica-stara-slika", photo: photos[i] });
            } catch (_) {}
          }
          try {
            post({ type: "pilurica-stara-gotovo", count: photos.length });
          } catch (_) {}
          msg.textContent =
            "Poslano u novu Piluricu: " +
            (payload.medicines || []).length +
            " lijekova, " +
            photos.length +
            " slika. Ovaj tab možete zatvoriti.";
          return;
        }
        download();
      }

      dump()
        .then((data) => {
          payload = data;
          const n = (data.medicines || []).length;
          const p = (data.photos || []).length;
          go.hidden = false;
          dl.hidden = false;
          if (!n) {
            msg.textContent =
              "Na ovom pregledniku nema stare baze. Otvori ovu stranicu iz ikone stare Pilurice (alkemija.com/app).";
            return;
          }
          msg.textContent = "Nađeno: " + n + " lijekova, " + p + " slika kutija. Šaljem u novu Piluricu.";
          send();
        })
        .catch(() => {
          msg.textContent =
            "Nisam uspio pročitati staru bazu. Otvori alkemija.com/app pa Postavke → Izvezi JSON kopiju.";
        });

      go.addEventListener("click", send);
      dl.addEventListener("click", download);
    </script>
  </body>
</html>
